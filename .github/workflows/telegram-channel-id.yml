name: Get Telegram channel ID

# Triggered on pushes to the integration branch; manual dispatch is also enabled.
on:
  push:
    branches:
      - integration/football-lab-main-plus-ai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-channel-id:
    runs-on: ubuntu-latest
    steps:
      - name: Read latest channel updates safely
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN repository secret.")

          base = f"https://api.telegram.org/bot{token}"
          def call(method, params=None):
              data = urllib.parse.urlencode(params or {}).encode()
              req = urllib.request.Request(f"{base}/{method}", data=data)
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              if not payload.get("ok"):
                  raise RuntimeError(f"Telegram {method} failed: {payload.get('description', 'unknown error')}")
              return payload["result"]

          identity = call("getMe")
          print(f"Token belongs to bot: @{identity.get('username', 'unknown')}")
          print(f"Bot ID: {identity.get('id', 'unknown')}")

          webhook = call("getWebhookInfo")
          print(f"Webhook configured: {'yes' if webhook.get('url') else 'no'}")
          print(f"Pending updates reported by Telegram: {webhook.get('pending_update_count', 0)}")
          if webhook.get("url"):
              print("A webhook is configured; getUpdates cannot be used until it is removed.")
              raise SystemExit(1)

          updates = call("getUpdates", {"offset": -20, "limit": 20, "timeout": 0, "allowed_updates": json.dumps(["channel_post", "edited_channel_post", "message"])})
          print(f"Updates returned by Telegram: {len(updates)}")
          for item in updates:
              print(f"Update {item.get('update_id')} contains: {', '.join(k for k in item.keys() if k != 'update_id')}")
          matches = []
          for update in updates:
              post = update.get("channel_post") or update.get("edited_channel_post")
              if not post:
                  continue
              chat = post.get("chat", {})
              if chat.get("type") == "channel":
                  matches.append((update.get("update_id"), chat.get("id"), chat.get("title"), post.get("text", "")))

          if not matches:
              print("No channel post was found in the bot's recent updates.")
              print("Confirm the bot is an administrator and publish a NEW channel message, then run this workflow again.")
              raise SystemExit(1)

          update_id, chat_id, title, message = matches[-1]
          print("Telegram channel detected successfully.")
          print(f"Channel title: {title}")
          print(f"Channel ID: {chat_id}")
          print(f"Update ID: {update_id}")
          print("Only the channel identifier is displayed; the bot token is never printed.")
          PY
